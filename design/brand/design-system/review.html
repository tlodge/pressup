<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<title>PressUp Design System</title>
<!-- Print source for the review PDF. Serve this folder, then print with headless Chrome (see CLAUDE.md). -->
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components/bundle.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
  @page { size: 297mm 420mm; margin: 16mm 18mm; }
  @page :first { margin: 0; }
  html { -webkit-print-color-adjust: exact; print-color-adjust: exact; background: var(--surface); }
  body { background: var(--surface); color: var(--ink); font-family: var(--font-sans); font-size: 15px; line-height: 23px; padding: 0; }
  .page { break-before: page; }

  /* Cover */
  .cover { height: 420mm; box-sizing: border-box; padding: 28mm 22mm; background: var(--surface); color: var(--ink); display: flex; flex-direction: column; gap: 14mm; position: relative; overflow: hidden; }
  .cover .logo { height: 46px; align-self: flex-start; }
  .cover h1 { font-family: var(--font-display); font-weight: 400; text-transform: uppercase; font-size: 150px; line-height: .9; margin: 0; }
  .cover h1 span { display: block; color: var(--accent); }
  .cover .meta { font-family: var(--font-condensed); font-weight: 600; letter-spacing: .12em; text-transform: uppercase; font-size: 16px; color: var(--ink-muted); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .cover .art { border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--line); }
  .cover .contents { margin-top: auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px 24px; font-family: var(--font-condensed); font-weight: 600; font-size: 18px; letter-spacing: .06em; text-transform: uppercase; }
  .cover .contents b { color: var(--accent); font-weight: 700; margin-right: 8px; }
  .cover .figs { position: absolute; right: 22mm; bottom: 28mm; height: 60px; opacity: .9; }

  /* Running type */
  .eyebrow { font-family: var(--font-condensed); font-weight: 600; letter-spacing: .14em; text-transform: uppercase; font-size: 13px; color: var(--ink-muted); margin: 0 0 4px; }
  h2.part { font-family: var(--font-display); font-weight: 400; text-transform: uppercase; font-size: 64px; line-height: .92; margin: 0 0 24px; }
  .md { max-width: 74ch; }
  .md h1 { display: none; }
  .md h2 { font-family: var(--font-display); font-weight: 400; text-transform: uppercase; font-size: 30px; line-height: 1; margin: 32px 0 10px; break-after: avoid; }
  .md h3 { font-family: var(--font-condensed); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; font-size: 18px; margin: 20px 0 6px; }
  .md p, .md li { margin: 0 0 8px; }
  .md ul { padding-left: 20px; margin: 0 0 12px; }
  .md li { break-inside: avoid; }
  .md code { font-family: ui-monospace, Menlo, monospace; font-size: .86em; background: var(--surface-sunken); padding: 1px 5px; border-radius: 4px; }
  .md table { border-collapse: collapse; width: 100%; margin: 8px 0 16px; font-size: 14px; line-height: 20px; break-inside: avoid; }
  .md th, .md td { text-align: left; vertical-align: top; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  .md th { font-family: var(--font-condensed); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: 13px; }
  .md img { max-height: 56px; background: #0a0a0a; padding: 14px 18px; border-radius: var(--radius-sm); }

  /* Tokens */
  .swatches { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px 28px; }
  .sw { display: grid; grid-template-columns: 44px 44px 1fr; gap: 12px; align-items: start; break-inside: avoid; padding: 5px 0; border-bottom: 1px solid var(--line); }
  .chip { height: 44px; border-radius: var(--radius-sm); display: grid; place-items: end start; padding: 4px 6px; box-sizing: border-box; font-family: var(--font-condensed); font-weight: 600; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; border: 1px solid var(--line-strong); }
  .chip-wrap { background: var(--surface); color: var(--ink-muted); border-radius: var(--radius-sm); }
  .chip-inner { width: 100%; height: 100%; border-radius: inherit; background: var(--c); }
  .sw-name { font-family: var(--font-condensed); font-weight: 700; font-size: 17px; letter-spacing: .03em; }
  .sw-vals { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: var(--ink-muted); }
  .sw-use { font-size: 13px; line-height: 19px; margin-top: 2px; }
  .legend { display: flex; gap: 20px; font-family: var(--font-condensed); font-weight: 600; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-muted); margin-bottom: 8px; }
  .type-row { display: grid; grid-template-columns: 220px 1fr; gap: 24px; align-items: baseline; padding: 14px 0; border-bottom: 1px solid var(--line); break-inside: avoid; }
  .type-meta b { display: block; font-family: var(--font-condensed); font-weight: 700; font-size: 17px; }
  .type-meta span { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: var(--ink-muted); }
  .type-meta p { font-size: 13px; line-height: 19px; margin: 4px 0 0; }
  .scale { display: grid; grid-template-columns: repeat(2, 1fr); gap: 32px; margin-top: 32px; }
  .scale table { width: 100%; border-collapse: collapse; font-size: 13px; line-height: 19px; }
  .scale td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .scale td:first-child { font-family: var(--font-condensed); font-weight: 700; font-size: 15px; white-space: nowrap; }
  .scale td:nth-child(2) { font-family: ui-monospace, Menlo, monospace; white-space: nowrap; }
  .bar { height: 12px; background: var(--press-yellow); border-radius: 3px; }

  /* Components */
  .comp { break-inside: avoid; margin-bottom: 40px; }
  .comp-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 6px; }
  .comp-head h3 { font-family: var(--font-display); font-weight: 400; text-transform: uppercase; font-size: 34px; line-height: 1; margin: 0; }
  .comp .md { font-size: 14px; line-height: 21px; margin-bottom: 12px; }
  .frames { display: flex; flex-direction: column; gap: 10px; }
  .frames.side { flex-direction: row; gap: 24px; align-items: flex-start; }
  .frames.pair { flex-direction: row; gap: 14px; align-items: stretch; }
  .frames.pair .fr { flex: 1; min-width: 0; }
  .fr { border: 1px solid var(--line-strong); border-radius: var(--radius-md); overflow: hidden; position: relative; }
  .fr iframe { display: block; border: 0; width: 100%; }
  .fr .tag { position: absolute; top: 8px; right: 10px; z-index: 2; font-family: var(--font-condensed); font-weight: 700; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; background: var(--surface-sunken); color: var(--ink-muted); border: 1px solid var(--line); }

  /* Assets */
  .asset-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin: 10px 0 26px; }
  .asset { break-inside: avoid; }
  .asset .tile { height: 120px; border-radius: var(--radius-sm); display: grid; place-items: center; padding: 14px; box-sizing: border-box; border: 1px solid var(--line); }
  .asset .tile img { max-width: 100%; max-height: 100%; }
  .asset .tile.photo { padding: 0; overflow: hidden; height: 170px; }
  .asset .tile.photo img { width: 100%; height: 100%; object-fit: cover; max-height: none; }
  .asset .tile.dk { background: #0a0a0a; }
  .asset .tile.lt { background: #fafaf6; }
  .asset p { margin: 6px 0 0; font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--ink-muted); word-break: break-all; }
</style>
</head>
<body>
<section class="cover" data-theme="dark">
  <img class="logo" src="assets/Logos/pressup-wordmark-on-dark.png" alt="PressUp">
  <h1>Design<span>system.</span></h1>
  <div class="meta"><span>For review</span><span class="pu-tagline-sep"></span><span id="date"></span><span class="pu-tagline-sep"></span><span>Dark and light themes</span></div>
  <div class="art"><iframe src="components/Cover/local.html#dark" style="width:100%;height:288px;border:0;display:block" title="Cover"></iframe></div>
  <div class="contents">
    <div><b>1</b>Brand book</div><div><b>2</b>Colour</div><div><b>3</b>Type and scale</div>
    <div><b>4</b>Components</div><div><b>5</b>Example screens</div><div><b>6</b>Logo and assets</div>
  </div>
  <img class="figs" src="assets/Graphics/pressup-figures-yellow.png" alt="">
</section>

<section class="page"><p class="eyebrow">1</p><h2 class="part">Brand book</h2><div class="md" id="readme"></div></section>
<section class="page"><p class="eyebrow">2</p><h2 class="part">Colour</h2>
  <div class="legend"><span>Left: dark theme</span><span>Right: light theme</span></div>
  <div class="swatches" id="colours"></div></section>
<section class="page"><p class="eyebrow">3</p><h2 class="part">Type and scale</h2><div id="type"></div><div class="scale" id="scale"></div></section>
<section class="page"><p class="eyebrow">4</p><h2 class="part">Components</h2><div id="comps"></div></section>
<section class="page"><p class="eyebrow">5</p><h2 class="part">Example screens</h2><div id="screens"></div></section>
<section class="page"><p class="eyebrow">6</p><h2 class="part">Logo and assets</h2><div id="assets"></div></section>

<script>
(async function () {
  var get = function (p) { return fetch(p).then(function (r) { return r.text(); }); };
  var md = function (s) { return marked.parse(s); };
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  document.getElementById('date').textContent = new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });

  // 1 Brand book
  document.getElementById('readme').innerHTML = md(await get('README.md'));

  // 2 Colour
  var tokens = JSON.parse(await get('tokens.json'));
  var colours = tokens.color.tokens, byName = {};
  colours.forEach(function (t) { byName[t.name] = t; });
  function val(t, theme) {
    var v = typeof t.value === 'string' ? t.value : (t.value[theme] || t.value.dark);
    var m = /^\{(.+)\}$/.exec(v);
    return m && byName[m[1]] ? val(byName[m[1]], theme) + ' ← ' + m[1] : v;
  }
  document.getElementById('colours').innerHTML = colours.map(function (t) {
    var chip = function (th) { return '<div class="chip-wrap" data-theme="' + th + '"><div class="chip" style="padding:0"><div class="chip-inner" style="--c: var(--' + t.name + ')"></div></div></div>'; };
    var d = val(t, 'dark'), l = val(t, 'light');
    return '<div class="sw">' + chip('dark') + chip('light') + '<div><div class="sw-name">' + esc(t.name) + '</div><div class="sw-vals">' + esc(d) + (l !== d ? ' / ' + esc(l) : '') + '</div><div class="sw-use">' + esc(t.usage || '') + '</div></div></div>';
  }).join('');

  // 3 Type and scale
  var fam = { display: 'var(--font-display)', condensed: 'var(--font-condensed)', sans: 'var(--font-sans)' };
  document.getElementById('type').innerHTML = tokens.type.groups.map(function (g) {
    return g.styles.map(function (s) {
      var css = 'font-family:' + fam[g.family] + ';font-size:' + s.fontSize + ';line-height:' + s.lineHeight + ';font-weight:' + s.fontWeight + ';letter-spacing:' + (s.letterSpacing || 0) + ';' + (g.family === 'display' || /label|overline/.test(s.name) ? 'text-transform:uppercase;' : '') + (/stat/.test(s.name) ? 'font-variant-numeric:tabular-nums;' : '');
      return '<div class="type-row"><div class="type-meta"><b>' + esc(s.name) + '</b><span>' + esc(g.name) + ' · ' + esc(s.fontSize) + ' / ' + esc(s.lineHeight) + ' · ' + esc(s.fontWeight) + '</span><p>' + esc(s.usage || '') + '</p></div><div style="' + css + '">' + esc(s.sample || s.name) + '</div></div>';
    }).join('');
  }).join('');
  function table(title, list, bar) {
    return '<div><h3 class="eyebrow" style="font-size:15px;color:var(--ink)">' + title + '</h3><table>' + list.map(function (t) {
      var v = typeof t.value === 'string' ? t.value : (t.value.dark + (t.value.light ? ' / ' + t.value.light : ''));
      return '<tr><td>' + esc(t.name) + '</td><td>' + esc(v) + '</td><td>' + (bar ? '<div class="bar" style="width:' + parseInt(t.value, 10) + 'px"></div>' : '') + esc(t.usage || '') + '</td></tr>';
    }).join('') + '</table></div>';
  }
  document.getElementById('scale').innerHTML = table('Spacing', tokens.spacing.tokens, true) +
    '<div>' + table('Radius', tokens.radius.tokens) + table('Stroke', tokens.stroke.tokens) + table('Shadow', tokens.shadow.tokens) + table('Opacity', tokens.opacity.tokens) + '</div>';

  // 4 Components and 5 Screens (heights match gallery.html)
  var comps = [
    ['BracketTitle', 'Brand', 144, 'pair'], ['EchoHeadline', 'Brand', 384, 'pair'], ['Rings', 'Brand', 264, 'pair'], ['Tagline', 'Brand', 96, 'pair'],
    ['Button', 'Actions', 120], ['Chip', 'Actions', 96, 'pair'], ['Badge', 'Status', 88, 'pair'],
    ['ProgressRing', 'Data', 194, 'pair'], ['StatTile', 'Data', 174],
    ['ExerciseCard', 'Workout', 294], ['RestTimer', 'Workout', 384, 'pair'], ['SetTable', 'Workout', 284], ['Stepper', 'Workout', 120, 'pair'],
    ['ProgrammeCard', 'Content', 544], ['TabBar', 'Navigation', 128, 'pair'], ['Icon', 'Foundations', 96]
  ];
  function frame(name, theme, h, w) {
    return '<div class="fr"' + (w ? ' style="width:' + w + 'px"' : '') + '><span class="tag">' + theme + '</span><iframe src="components/' + name + '/local.html#' + theme + '" style="height:' + h + 'px" title="' + name + ' ' + theme + '"></iframe></div>';
  }
  async function block(name, group, h, mode) {
    var readme = await get('components/' + name + '/README.md');
    var frames = mode === 'dark-only' ? frame(name, 'dark', h, mode.w)
      : mode === 'pair' ? '<div class="frames pair">' + frame(name, 'dark', h) + frame(name, 'light', h) + '</div>'
      : mode === 'side' ? '<div class="frames side">' + frame(name, 'dark', h, 390) + frame(name, 'light', h, 390) + '</div>'
      : '<div class="frames">' + frame(name, 'dark', h) + frame(name, 'light', h) + '</div>';
    return '<div class="comp"><div class="comp-head"><h3>' + name + '</h3><span class="eyebrow">' + group + '</span></div><div class="md">' + md(readme) + '</div>' + frames + '</div>';
  }
  document.getElementById('comps').innerHTML = (await Promise.all(comps.map(function (c) { return block(c[0], c[1], c[2], c[3]); }))).join('');
  document.getElementById('screens').innerHTML = (await Promise.all([
    block('TodayScreen', 'App', 904, 'side'),
    block('WorkoutScreen', 'App', 904, 'side'),
    block('WebHero', 'Website, dark only', 1204, 'dark-only')
  ])).join('');

  // 6 Assets
  var idx = JSON.parse(await get('design-system.json'));
  var html = '';
  for (var gi = 0; gi < idx.groups.length; gi++) {
    var g = idx.groups[gi], ag = idx.assetGroups[g];
    var readme = await get('assets/' + g + '/README.md');
    html += '<div class="comp"><div class="comp-head"><h3>' + g + '</h3></div><div class="md">' + md(readme) + '</div><div class="asset-grid">' +
      ag.order.map(function (f) {
        var cls = g === 'Imagery' ? 'photo' : /on-dark|white|yellow/.test(f) ? 'dk' : 'lt';
        return '<div class="asset"><div class="tile ' + cls + '"><img src="assets/' + g + '/' + f + '" alt=""></div><p>' + f + '</p></div>';
      }).join('') + '</div></div>';
  }
  document.getElementById('assets').innerHTML = html;
  document.body.setAttribute('data-ready', '1');
})();
</script>
</body>
</html>
