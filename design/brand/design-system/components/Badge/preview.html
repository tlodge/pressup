<!doctype html>
<html>
<head><meta charset="utf-8"><title>Badge</title></head>
<body>
<div id="root" class="pu-row"></div>
<script>
  var P = window.PressUp, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null, h(P.Badge, { tone: 'pr' }, 'New PR'), h(P.Badge, { tone: 'done' }, 'Done'), h(P.Badge, { tone: 'missed' }, 'Missed'), h(P.Badge, { tone: 'neutral' }, 'Deload')));
</script>
</body>
</html>
