<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>function puTheme(){document.documentElement.setAttribute('data-theme', location.hash.slice(1) === 'light' ? 'light' : 'dark');} puTheme(); window.addEventListener('hashchange', puTheme);</script>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="../bundle.js"></script>

<meta charset="utf-8">
<title>PressUp</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--surface); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .yellow { fill:var(--press-yellow); }
  .deep { fill:var(--ink); }
  .blk { rx:var(--radius-md); }
  .ring { fill:none; stroke:var(--accent); stroke-width:var(--stroke-hairline); opacity:var(--ring-faint); }
  .arc { fill:none; stroke:var(--surface); stroke-width:var(--stroke-ring); stroke-linecap:round; }
  .head { fill:none; stroke:var(--surface); stroke-width:8px; }
  .words { position:absolute; left:var(--space-8); bottom:var(--space-8); max-width:440px; }
  .name { margin:0; font-family:var(--font-display); font-weight:400; font-size:104px; line-height:.92; color:var(--ink); }
  .tag { margin:var(--space-2) 0 0 2px; font-size:14px; line-height:20px; color:var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      press-yellow 160×248 bled off the top (the brand, largest) · ink 176×136 (the white of the wordmark) — about 25% of 960×288
  arrangement one tall yellow slab with an ink satellite, bottoms on one line space-8 above the edge, space-4 gutters
  pattern     a literal motif, because the brand IS one round-capped line: the logo's arc and dot cut out of the ink block in surface, plus four concentric hairline rings from the posters centred on that dot
  scales      sides in space-4 multiples; gutters space-4; corners radius-md; arc stroke-ring; rings stroke-hairline at ring-faint
-->
<rect class="yellow blk" x="16" y="-8" width="160" height="248" rx="16"/>
<rect class="deep blk" x="192" y="104" width="176" height="136" rx="16"/>
<path class="arc" d="M232 216 A48 48 0 0 1 328 216"/>
<circle class="head" cx="338" cy="166" r="10"/>
<circle class="ring" cx="338" cy="166" r="40"/>
<circle class="ring" cx="338" cy="166" r="88"/>
<circle class="ring" cx="338" cy="166" r="136"/>
<circle class="ring" cx="338" cy="166" r="184"/>
</svg>
</div>
<div class="words">
<h1 class="name">PressUp</h1>
<p class="tag">Challenge, motivate, succeed. Bold where it counts, calm where you lift.</p>
</div>
</div>
</body>
</html>
