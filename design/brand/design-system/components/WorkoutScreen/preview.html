<!doctype html>
<html>
<head><meta charset="utf-8"><title>Workout screen</title>
<style>
  .scr { width: 390px; max-width: 100%; margin: 0 auto; min-height: 844px; background: var(--surface); padding: var(--space-5); box-sizing: border-box; display: flex; flex-direction: column; gap: var(--space-5); }
  .bar { display: flex; justify-content: space-between; align-items: center; font-family: var(--font-condensed); font-weight: 700; font-size: 18px; letter-spacing: .06em; color: var(--ink); font-variant-numeric: tabular-nums; }
  .bar span { color: var(--ink-muted); font-weight: 600; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; }
  .prog { height: 6px; border-radius: 999px; background: var(--line); overflow: hidden; }
  .prog i { display: block; height: 100%; width: 40%; background: var(--accent); border-radius: 999px; }
  .eyebrow { font-family: var(--font-condensed); font-weight: 600; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); margin: 0 0 var(--space-1); }
  .name { font-size: 24px; line-height: 30px; font-weight: 500; margin: 0; color: var(--ink); }
  .cue { font-size: 14px; line-height: 20px; color: var(--ink-muted); margin: var(--space-2) 0 0; }
  .entry { display: flex; justify-content: space-between; gap: var(--space-2); }
  .sheet { margin-top: auto; background: var(--surface-raised); border-radius: var(--radius-lg); padding: var(--space-5); box-shadow: var(--shadow-float); display: flex; flex-direction: column; align-items: center; gap: var(--space-4); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var P = window.PressUp, h = React.createElement;
  function App() {
    return h('div', { className: 'scr' },
      h('div', { className: 'bar' }, h(P.Button, { variant: 'ghost', size: 'sm' }, 'End'), '24:18', h('span', null, '2 of 5')),
      h('div', { className: 'prog' }, h('i')),
      h('div', null,
        h('p', { className: 'eyebrow' }, 'Exercise 2 · Chest'),
        h('h1', { className: 'name' }, 'Incline dumbbell press'),
        h('p', { className: 'cue' }, 'Bench at 30°. Lower to the upper chest, elbows at 45°, press up and together.')),
      h(P.SetTable, { sets: [ { prev: '24 × 10', weight: 26, reps: 10, done: true }, { prev: '24 × 10', weight: 26, reps: 9 }, { prev: '24 × 9', weight: 26, reps: 8 } ] }),
      h('div', { className: 'entry' }, h(P.Stepper, { value: 26, step: 2, unit: 'kg' }), h(P.Stepper, { value: 9, step: 1, unit: 'reps' })),
      h('div', { className: 'sheet' }, h(P.RestTimer, { total: 90, seconds: 58, size: 180 })));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
